# In-house rules for the design points that ruff and import-linter cannot see. Each rule has a test in
# semgrep/ebaml.py; run `uv run semgrep --test semgrep` to check them. The layer limits live in pyproject.toml
# ([tool.importlinter]); the rules for them are in .claude/rules/architecture.md.
rules:
  - id: ebaml-no-kwargs-bag
    languages: [python]
    severity: ERROR
    message: >-
      A **kwargs parameter hides what the function reads (SOLID: I). Take the values as named parameters or as an
      attrs option class.
    pattern: |
      def $F(..., **$K):
          ...
    paths:
      include: ["/src/ebaml/"]

  - id: ebaml-no-elif-chain-on-one-value
    languages: [python]
    severity: ERROR
    message: >-
      A chain that tests one value against three or more cases needs an edit for each new case (SOLID: O). Look the
      case up in a table or use one class per case.
    pattern: |
      if $X == $A:
          ...
      elif $X == $B:
          ...
      elif $X == $C:
          ...
    paths:
      include: ["/src/ebaml/"]

  - id: ebaml-no-not-implemented-stub
    languages: [python]
    severity: ERROR
    message: >-
      A method that raises NotImplementedError breaks the promise of its base class (SOLID: L). Make the method
      abstract with abc.abstractmethod, or remove it from the base class.
    pattern-either:
      - pattern: raise NotImplementedError
      - pattern: raise NotImplementedError(...)
    paths:
      include: ["/src/ebaml/"]

  - id: ebaml-domain-does-no-io
    languages: [python]
    severity: ERROR
    message: >-
      Code in core, graphs and local runs in a plain unit test (SOLID: D). Read the file, print or call the service
      in the edge code (llm) and pass the result in.
    pattern-either:
      - pattern: print(...)
      - pattern: open(...)
      - pattern: $P.read_text(...)
      - pattern: $P.read_bytes(...)
      - pattern: $P.write_text(...)
      - pattern: $P.write_bytes(...)
      - pattern: os.environ
      - pattern: os.getenv(...)
    paths:
      include: ["/src/ebaml/core/", "/src/ebaml/graphs/", "/src/ebaml/local/"]

  - id: ebaml-preferred-libraries
    languages: [python]
    severity: ERROR
    message: >-
      Use structlog instead of logging, orjson instead of json and attrs instead of dataclasses
      (.claude/rules/libraries.md).
    pattern-either:
      - pattern: import logging
      - pattern: from logging import $X
      - pattern: import json
      - pattern: from json import $X
      - pattern: import dataclasses
      - pattern: from dataclasses import $X
    paths:
      include: ["/src/", "/tests/", "/scripts/", "/benchmark/", "/notebooks/"]

  - id: ebaml-no-manual-beartype
    languages: [python]
    severity: ERROR
    message: >-
      beartype_this_package already checks every function in ebaml. Remove the decorator
      (.claude/rules/libraries.md).
    pattern-either:
      - pattern: |
          @beartype
          def $F(...): ...
      - pattern: |
          @beartype.beartype
          def $F(...): ...
    paths:
      include: ["/src/ebaml/"]

  - id: ebaml-no-bare-value-error
    languages: [python]
    severity: ERROR
    message: >-
      Raise a subclass of EBaMlError from ebaml.core.exceptions, so callers can catch the errors of ebaml apart from
      the errors of other code. Give a new error class ValueError as a second base, so `except ValueError` still
      catches it.
    pattern-either:
      - pattern: raise ValueError
      - pattern: raise ValueError(...)
      - pattern: raise ValueError(...) from $CAUSE
    paths:
      include: ["/src/ebaml/"]

  - id: ebaml-sdk-fake-is-checked
    languages: [python]
    severity: ERROR
    message: >-
      Wrap a fake of a baml_sdk function in fake_sdk with the same name (tests/unit/ebaml/conftest.py). The wrapper
      checks each call against the signature that `baml generate` wrote, so the fake cannot drift from the real
      function.
    patterns:
      - pattern: $MP.setattr(baml_sdk, $NAME, $FAKE)
      - pattern-not: $MP.setattr(baml_sdk, $NAME, fake_sdk($NAME, ...))
    paths:
      include: ["/tests/"]

  - id: ebaml-asdict-recurse-false
    languages: [python]
    severity: ERROR
    message: >-
      Pass the fields of an attrs class on with `attrs.asdict(x, recurse=False)`. Without `recurse=False`, a field that
      holds an attrs class becomes a dict, and the `**` call no longer fits. See .claude/rules/types.md.
    patterns:
      - pattern: $F(..., **attrs.asdict(...), ...)
      - pattern-not: $F(..., **attrs.asdict(..., recurse=False, ...), ...)
    paths:
      include: ["/src/ebaml/"]

  - id: ebaml-return-attrs-not-container
    languages: [python]
    severity: ERROR
    message: >-
      Return an attrs class, not a dict, a tuple of fields or a list of them, so a type checker knows each field and a
      caller reads it by name. If the keys are data (not a fixed set of fields) or the container is the point (a
      JSON fragment, a homogeneous interval), add `# nosemgrep: ebaml-return-attrs-not-container -- <reason>` to the
      def line. See .claude/rules/types.md.
    patterns:
      - pattern: |
          def $F(...) -> $R:
              ...
      - metavariable-pattern:
          metavariable: $R
          pattern-either:
            - pattern: dict[...]
            - pattern: list[dict[...]]
            - pattern: tuple[...]
            - pattern: list[tuple[...]]
      # a tuple of one type and any length (`tuple[float, ...]`) is a sequence, not a bag of fields
      - metavariable-regex:
          metavariable: $R
          regex: '^(?!tuple\[[^,\[\]]+,\s*\.\.\.\]$)'
      - focus-metavariable: $R
    paths:
      include: ["/src/ebaml/"]

  - id: ebaml-no-object-type
    languages: [python]
    severity: ERROR
    message: >-
      Name the type instead of `object`. `object` accepts every value, so neither pyrefly nor beartype checks anything,
      as with `Any`. Use a named alias of `ebaml.core.custom_types` (`ClassLabel`, `FeatureValue`, `JSONValue`) or a
      union of the real types. A parameter that exists to inspect a value of any type (a validator, a reader of an
      untyped record) may keep `object`: add `# nosemgrep: ebaml-no-object-type -- <reason>` on the line of the
      hint or on the line above it. See .claude/rules/types.md.
    patterns:
      - pattern-either:
          - pattern: |
              def $F(..., $P: $T, ...):
                  ...
          - pattern: |
              def $F(..., $P: $T = $D, ...):
                  ...
          - pattern: |
              def $F(..., *$P: $T, ...):
                  ...
          - pattern: |
              def $F(..., **$P: $T, ...):
                  ...
          - pattern: |
              def $F(...) -> $T:
                  ...
          - pattern: "$X: $T"
          - pattern: "$X: $T = $V"
          - pattern: "type $A = $T"
      # the text of the hint, so a string annotation such as "list[object]" matches too
      - metavariable-regex:
          metavariable: $T
          regex: '.*\bobject\b'
      - focus-metavariable: $T
    paths:
      include: ["/src/ebaml/"]

  - id: ebaml-isinstance-abstract-type
    languages: [python]
    severity: ERROR
    message: >-
      Check against the abstract type that the code needs, not the concrete class: `Mapping` instead of `dict`,
      `Sequence` instead of `list`, `collections.abc.Set` instead of `set` or `frozenset`. A check of the concrete
      class rejects a fitting object (a `MappingProxyType`, a `pandas` index), as a too narrow hint does. See
      .claude/rules/types.md.
    patterns:
      - pattern-either:
          - pattern: isinstance($X, $T)
          - pattern: issubclass($X, $T)
          - pattern: type($X) is $T
          - pattern: type($X) is not $T
          - pattern: type($X) == $T
          - pattern: type($X) != $T
      # the text of the type, so a tuple of types or a union such as `str | dict` matches too
      - metavariable-regex:
          metavariable: $T
          regex: '.*(?<![\w.])(dict|list|set|frozenset)\b'
      - focus-metavariable: $T
    paths:
      include: ["/src/ebaml/"]

  - id: ebaml-polymorphism-not-type-branches
    languages: [python]
    severity: ERROR
    message: >-
      Tell, don't ask: give each class a method and call it, instead of branches on the type of one value. Each new
      class otherwise needs an edit of every branch (SOLID: O). For classes that ebaml does not own, use
      `functools.singledispatch`. A check that narrows one union at the edge of the code (a parsed record) may stay:
      add `# nosemgrep: ebaml-polymorphism-not-type-branches -- <reason>` on the line of the first branch. See
      .claude/rules/solid.md.
    pattern-either:
      - pattern: |
          if isinstance($X, $A):
              ...
          elif isinstance($X, $B):
              ...
      - pattern: |
          if isinstance($X, $A):
              ...
          ...
          if isinstance($X, $B):
              ...
      # semgrep cannot parse a class pattern with arguments in a case, so a regex finds two class patterns in one match
      - pattern-regex: '(?m)^[ \t]*case[ \t]+[A-Za-z_][\w.]*\(.*\n(?:(?![ \t]*match\b).*\n)*?[ \t]*case[ \t]+[A-Za-z_][\w.]*\('
    paths:
      include: ["/src/ebaml/"]
