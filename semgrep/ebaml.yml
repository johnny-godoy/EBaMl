# In-house rules for the design points that ruff and import-linter cannot see. Each rule has a test in
# semgrep/ebaml.py; run `uv run semgrep --test semgrep` to check them. The layer limits live in pyproject.toml
# ([tool.importlinter]); the rules for them are in .claude/rules/architecture.md.
rules:
  - id: ebaml-no-kwargs-bag
    languages: [python]
    severity: ERROR
    message: >-
      A **kwargs parameter hides what the function reads (SOLID: I). Take the values as named parameters or as an
      attrs option class.
    pattern: |
      def $F(..., **$K):
          ...
    paths:
      include: ["/src/ebaml/"]

  - id: ebaml-no-elif-chain-on-one-value
    languages: [python]
    severity: ERROR
    message: >-
      A chain that tests one value against three or more cases needs an edit for each new case (SOLID: O). Look the
      case up in a table or use one class per case.
    pattern: |
      if $X == $A:
          ...
      elif $X == $B:
          ...
      elif $X == $C:
          ...
    paths:
      include: ["/src/ebaml/"]

  - id: ebaml-no-not-implemented-stub
    languages: [python]
    severity: ERROR
    message: >-
      A method that raises NotImplementedError breaks the promise of its base class (SOLID: L). Make the method
      abstract with abc.abstractmethod, or remove it from the base class.
    pattern-either:
      - pattern: raise NotImplementedError
      - pattern: raise NotImplementedError(...)
    paths:
      include: ["/src/ebaml/"]

  - id: ebaml-domain-does-no-io
    languages: [python]
    severity: ERROR
    message: >-
      Code in core, graphs and local runs in a plain unit test (SOLID: D). Read the file, print or call the service
      in the edge code (llm) and pass the result in.
    pattern-either:
      - pattern: print(...)
      - pattern: open(...)
      - pattern: $P.read_text(...)
      - pattern: $P.read_bytes(...)
      - pattern: $P.write_text(...)
      - pattern: $P.write_bytes(...)
      - pattern: os.environ
      - pattern: os.getenv(...)
    paths:
      include: ["/src/ebaml/core/", "/src/ebaml/graphs/", "/src/ebaml/local/"]

  - id: ebaml-preferred-libraries
    languages: [python]
    severity: ERROR
    message: >-
      Use structlog instead of logging, orjson instead of json and attrs instead of dataclasses
      (.claude/rules/libraries.md).
    pattern-either:
      - pattern: import logging
      - pattern: from logging import $X
      - pattern: import json
      - pattern: from json import $X
      - pattern: import dataclasses
      - pattern: from dataclasses import $X
    paths:
      include: ["/src/", "/tests/", "/scripts/", "/benchmark/", "/notebooks/"]

  - id: ebaml-no-manual-beartype
    languages: [python]
    severity: ERROR
    message: >-
      beartype_this_package already checks every function in ebaml. Remove the decorator
      (.claude/rules/libraries.md).
    pattern-either:
      - pattern: |
          @beartype
          def $F(...): ...
      - pattern: |
          @beartype.beartype
          def $F(...): ...
    paths:
      include: ["/src/ebaml/"]

  - id: ebaml-no-bare-value-error
    languages: [python]
    severity: ERROR
    message: >-
      Raise a subclass of EBaMlError from ebaml.core.exceptions, so callers can catch the errors of ebaml apart from
      the errors of other code. Give a new error class ValueError as a second base, so `except ValueError` still
      catches it.
    pattern-either:
      - pattern: raise ValueError
      - pattern: raise ValueError(...)
      - pattern: raise ValueError(...) from $CAUSE
    paths:
      include: ["/src/ebaml/"]

  - id: ebaml-sdk-fake-is-checked
    languages: [python]
    severity: ERROR
    message: >-
      Wrap a fake of a baml_sdk function in fake_sdk with the same name (tests/unit/ebaml/conftest.py). The wrapper
      checks each call against the signature that `baml generate` wrote, so the fake cannot drift from the real
      function.
    patterns:
      - pattern: $MP.setattr(baml_sdk, $NAME, $FAKE)
      - pattern-not: $MP.setattr(baml_sdk, $NAME, fake_sdk($NAME, ...))
    paths:
      include: ["/tests/"]

  - id: ebaml-asdict-recurse-false
    languages: [python]
    severity: ERROR
    message: >-
      Pass the fields of an attrs class on with `attrs.asdict(x, recurse=False)`. Without `recurse=False`, a field that
      holds an attrs class becomes a dict, and the `**` call no longer fits. See .claude/rules/types.md.
    patterns:
      - pattern: $F(..., **attrs.asdict(...), ...)
      - pattern-not: $F(..., **attrs.asdict(..., recurse=False, ...), ...)
    paths:
      include: ["/src/ebaml/"]

  - id: ebaml-return-attrs-not-container
    languages: [python]
    severity: ERROR
    message: >-
      Return an attrs class, not a dict, a tuple of fields or a list of them, so a type checker knows each field and a
      caller reads it by name. If the keys are data (not a fixed set of fields) or the container is the point (a
      JSON fragment, a homogeneous interval), add `# nosemgrep: ebaml-return-attrs-not-container -- <reason>` to the
      def line. See .claude/rules/types.md.
    patterns:
      - pattern: |
          def $F(...) -> $R:
              ...
      - metavariable-pattern:
          metavariable: $R
          pattern-either:
            - pattern: dict[...]
            - pattern: list[dict[...]]
            - pattern: tuple[...]
            - pattern: list[tuple[...]]
      # a tuple of one type and any length (`tuple[float, ...]`) is a sequence, not a bag of fields
      - metavariable-regex:
          metavariable: $R
          regex: '^(?!tuple\[[^,\[\]]+,\s*\.\.\.\]$)'
      - focus-metavariable: $R
    paths:
      include: ["/src/ebaml/"]
