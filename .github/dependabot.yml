version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    cooldown:
      default-days: 7
    # conventional commits (.claude/rules/commits-and-prs.md): "build(deps): bump ..." or "build(deps-dev): bump ..."
    commit-message:
      prefix: build
      include: scope
  # The workflows and the composite actions pin each action to a commit SHA, so Dependabot must update both places.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
    # conventional commits: "ci(deps): bump ..."
    commit-message:
      prefix: ci
      include: scope
