name: Setup
description: Install uv, the BAML toolchain, the project environment, and generate the BAML SDK
inputs:
  generate:
    description: Run `baml generate` (src/baml_sdk is gitignored, so anything importing ebaml needs it)
    default: "true"
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Install BAML toolchain
      shell: bash
      # The installer takes the newest toolchain unless it gets a version. A toolchain newer than the baml-bridge of
      # uv.lock writes a baml_sdk that baml-bridge cannot read (see scripts/baml_toolchain.py), so install the version
      # that the lock file pins for baml-bridge.
      run: | # nosemgrep: yaml.github-actions.security.gha-curl-pipe-shell.gha-curl-pipe-shell -- BAML publishes no checksum for its installer, so the version is the only pin
        version="$(python3 scripts/baml_toolchain.py)"
        curl -fsSL https://pkg.boundaryml.com/install.sh | sh -s -- --version "$version"
        echo "$HOME/.baml/bin" >> "$GITHUB_PATH"
    # The project build needs src/baml_sdk, so generate before the sync. Without generation, skip installing the project.
    - name: Generate BAML SDK
      if: inputs.generate == 'true'
      shell: bash
      run: baml generate
    - name: Sync environment
      shell: bash
      env:
        GENERATE: ${{ inputs.generate }}
      run: |
        if [ "$GENERATE" = "true" ]; then
          uv sync --frozen
        else
          uv sync --frozen --no-install-project
        fi
