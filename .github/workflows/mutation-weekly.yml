name: Mutation (weekly)

# Full mutation run over every module. The PR run in ci.yml covers only changed modules, so this run catches a mutant
# that a change elsewhere lets survive. It skips the work when no code changed in the last 7 days, because the project
# can lie idle for longer than a week. Each module runs in its own job, so the modules run in parallel and one slow
# module cannot hit the time limit of the others. One issue lists the survivors of all modules.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: Run even when no code changed in the last 7 days
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  OPENROUTER_API_KEY: unused # offline tests run on a scripted client; the key is only read when a request is sent

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.changes.outputs.run }}
      modules: ${{ steps.modules.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check for code changes in the last 7 days
        id: changes
        env:
          FORCE: ${{ inputs.force }}
        run: |
          changed=$(git log --since="7 days ago" --oneline -- src tests baml_src cosmic-ray.toml pyproject.toml | wc -l)
          if [ "$changed" -gt 0 ] || [ "$FORCE" = "true" ]; then run=true; else run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Commits touching code in the last 7 days: $changed (run=$run)"
      - name: List the modules
        id: modules
        run: echo "modules=$(find src/ebaml -name '*.py' -not -path 'src/ebaml/*/__init__.py' | sort | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  mutation:
    name: mutation (${{ matrix.module }})
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false # a surviving mutant in one module must not hide the result of the others
      matrix:
        module: ${{ fromJSON(needs.plan.outputs.modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Run cosmic-ray on the module, fail on any surviving mutant
        env:
          MODULE: ${{ matrix.module }}
        run: |
          mkdir -p /tmp/ci-logs
          uv run python scripts/mutation.py "$(nproc)" --module "$MODULE" 2>&1 | tee /tmp/ci-logs/mutation.log
      - name: Collect the session and list surviving mutants with diffs
        if: always()
        run: | # the artifact action skips a path that has a hidden directory, so copy out of .mutation/
          mkdir -p mutation-out
          cp .mutation/session.sqlite mutation-out/ || true
          uv run python -m cosmic_ray.tools.report .mutation/session.sqlite --surviving-only --show-diff \
            > mutation-out/survivors.txt || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-${{ strategy.job-index }}
          path: mutation-out/
          if-no-files-found: ignore

  report:
    name: report
    needs: mutation
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-*
          path: /tmp/mutation
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The weekly full mutation run found surviving mutants or failed. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```diff'
            cat /tmp/mutation/*/survivors.txt 2>/dev/null | head -c 50000 || true
            echo '```'
          } > /tmp/issue.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Weekly mutation run failed ($(date -u +%F))" --body-file /tmp/issue.md
