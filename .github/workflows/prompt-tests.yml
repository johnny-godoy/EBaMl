name: Prompt tests

# Live prompt tests (baml_src/prompt_tests.baml) send real requests to OpenRouter, so they are slow, rate limited and
# not deterministic. They live in their own workflow: a failure here never blocks or reddens the CI workflow, and
# nothing in CI depends on this workflow. Do not make it a required status check.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["baml_src/**", ".github/workflows/prompt-tests.yml"]
  pull_request:
    paths: ["baml_src/**", ".github/workflows/prompt-tests.yml"]

concurrency:
  group: prompt-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  live:
    name: live prompt tests
    # Fork PRs get no secrets, so skip them instead of failing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}
    steps:
      - name: Check for the secret
        if: env.HAS_KEY != 'true'
        run: echo "::notice::OPENROUTER_API_KEY secret is not set; skipping the live prompt tests."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_KEY == 'true'
      - uses: ./.github/actions/setup
        if: env.HAS_KEY == 'true'
        with:
          generate: "false"
      - name: Run live prompt tests
        if: env.HAS_KEY == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        # The model is not deterministic, so each failed test is retried on its own, up to two more times. A rerun of
        # the whole suite would need every test to pass in the same attempt, which grows unlikely with each new test.
        # A low concurrency keeps the free router below its rate limit.
        run: |
          mkdir -p logs
          selectors=(-i root::Live)
          for attempt in 1 2 3; do
            log="logs/prompt-tests-$attempt.log"
            if baml test "${selectors[@]}" --max-concurrency 2 --color never 2>&1 | tee "$log"; then
              exit 0
            fi
            mapfile -t failed < <(sed -nE 's/^FAIL (root::.*) \([^)]*\)$/\1/p' "$log")
            if [ "${#failed[@]}" -eq 0 ]; then
              echo "::error::baml test failed, but its output names no failed test; see $log"
              exit 1
            fi
            echo "::warning::attempt $attempt: ${#failed[@]} live prompt tests failed"
            selectors=()
            for id in "${failed[@]}"; do
              selectors+=(-i "$id")
            done
          done
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && env.HAS_KEY == 'true'
        with:
          name: prompt-test-logs
          path: logs/
          if-no-files-found: ignore
