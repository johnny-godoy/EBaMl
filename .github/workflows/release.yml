name: Release

# After a green CI run on main, release the pending changelog fragments:
#   version: check that CI passed on the head of main, choose the version (scripts/release.py), raise it with `uv version`, move the fragments into CHANGELOG.md
#            with `scriv collect`, then push one release commit and the tag v<version>. With no fragment, it only tags
#            the current version if that version has no tag yet. With nothing to release, the run stops here.
#   build:   build the wheel and the sdist from the tag, check their metadata and contents, install each in a clean
#            environment and run a smoke test, then write the checksums and the SBOM.
#   github-release: create the GitHub release of the tag, with the CHANGELOG.md entry as notes, the built files, the
#            checksums and the SBOM.
#   publish: check the checksums, then upload to PyPI with attestations, only if the repository variable
#            PUBLISH_TO_PYPI is "true".
#   verify:  install the published version from PyPI in a clean environment and run the smoke test again.
# A tag pushed with the default token starts no other workflow, so the build and the upload run here, not on the tag.
on:
  # A release needs a green CI run, so it starts when the CI workflow of main ends, not when main changes.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A failed or cancelled CI run does not release. A newer CI run releases the commits of the older one.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: read # list the CI runs of the commit
      contents: write # push the release commit and the tag
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The ruleset of main (.github/rulesets/main.json) lets only an admin push without a pull request, so
          # RELEASE_TOKEN is a token of an admin. Without the ruleset, the default token is enough.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check that CI passed on this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          CI_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          head="$(git rev-parse HEAD)"
          # A manual run releases the head of main. An automatic run releases the commit that its CI run checked.
          if [ -n "$CI_COMMIT" ] && [ "$CI_COMMIT" != "$head" ]; then
            echo "::notice::main moved to $head after CI ran on $CI_COMMIT. The CI run of $head releases it."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          passed="$(gh run list --workflow ci.yml --branch main --commit "$head" --status success --json databaseId --jq length)"
          if [ "$passed" -eq 0 ]; then
            echo "::error::No successful CI run exists for $head, so it is not released."
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Choose the version
        id: next
        if: steps.ci.outputs.ok == 'true'
        run: |
          version="$(uv run --frozen --only-group release python -m scripts.release)"
          collect=true
          if [ -z "$version" ]; then
            collect=false
            current="$(uv version --short --frozen)"
            if ! git ls-remote --exit-code --tags origin "refs/tags/v$current" > /dev/null; then
              version="$current"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "collect=$collect" >> "$GITHUB_OUTPUT"
      - name: Collect the fragments into CHANGELOG.md
        if: steps.next.outputs.version != '' && steps.next.outputs.collect == 'true'
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv version "$VERSION" --no-sync
          uv run --frozen --only-group release scriv collect --add
          git add pyproject.toml uv.lock CHANGELOG.md
          git commit -m "chore(release): $VERSION"
      - name: Push the release commit and the tag
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push --atomic origin HEAD:main "refs/tags/v$VERSION"

  build:
    name: build
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.version.outputs.version }}
      - uses: ./.github/actions/setup # the wheel must contain the generated baml_sdk
      - name: Check the tag matches the version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: test "$(uv version --short --frozen)" = "$VERSION"
      - run: uv build
      - name: Check that the build left the working tree clean
        run: test -z "$(git status --porcelain)"
      - name: Check the wheel contains the generated SDK
        run: unzip -l dist/*.whl | grep -q 'baml_sdk/__init__.py'
      - name: Check the metadata of the files
        # --strict fails on a warning, for example a long description that PyPI cannot render.
        run: uv run --frozen --only-group dist twine check --strict dist/*
      - name: Check the contents of the files
        run: uv run --frozen --only-group dist pydistcheck --inspect dist/*
      - name: Install each file in a clean environment and run the smoke test
        # Both runs install the newest release of each dependency that the requirements allow, as a user gets them.
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          uv run --frozen --only-group dist python -m scripts.smoke_install dist/*.whl "$VERSION" --extras mcp
          uv run --frozen --only-group dist python -m scripts.smoke_install dist/*.tar.gz "$VERSION" --extras mcp
      - name: Write the checksums and the SBOM
        # The files go to their own directory, because `uv publish` uploads everything in dist/. The SBOM lists the
        # packages of uv.lock, the set that the release was tested with.
        run: |
          mkdir release-assets
          (cd dist && sha256sum -- * > ../release-assets/SHA256SUMS)
          uv export --frozen --no-dev --all-extras --no-emit-project --format cyclonedx1.5 \
            --output-file release-assets/ebaml-sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/

  github-release:
    name: github release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.version.outputs.version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets/
      - name: Create the release from the changelog entry
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          uv run --frozen --only-group release scriv print --version "$VERSION" --output "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" dist/* release-assets/* --verify-tag --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"

  publish:
    name: publish
    needs: build
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/ebaml
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets/
      - name: Check that the files are the ones that the build job tested
        run: (cd dist && sha256sum --check --strict ../release-assets/SHA256SUMS)
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # With trusted publishing, uv publish also uploads a PEP 740 attestation of each file (--no-attestations turns it
      # off). The attestation names this workflow and the commit that built the file.
      - run: uv publish

  verify:
    name: verify the published version
    needs: [version, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.version.outputs.version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install the version from PyPI in a clean environment and run the smoke test
        # PyPI can need some minutes to list a new version, so the step tries again.
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            if uv run --frozen --only-group dist python -m scripts.smoke_install "ebaml==$VERSION" "$VERSION" --extras mcp; then
              exit 0
            fi
            echo "Attempt $attempt failed. Waiting before the next attempt."
            sleep 60
          done
          echo "::error::ebaml $VERSION does not install from PyPI or fails its smoke test. See docs/releasing.md."
          exit 1
