name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The notebook only calls the LLM on a button press, so exporting it needs no key; BAML reads it when a request is sent.
  OPENROUTER_API_KEY: unused

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup # the notebook imports baml_sdk, so it must be generated
      - name: Build the docs
        # --strict: a broken link or a docstring that does not render fails the build.
        # The build runs the notebook (it downloads the Titanic data from OpenML) and exports its output.
        run: uv run --frozen --group docs mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    name: deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
