name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The notebook only calls the LLM on a button press, so exporting it needs no key; BAML reads it when a request is sent.
  OPENROUTER_API_KEY: unused

jobs:
  changes:
    name: docs changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    # The ruleset requires "docs build" on every pull request, so the build is skipped with a job-level `if` and not
    # removed with a workflow-level `paths:` filter. Outside a pull request the build always runs.
    outputs:
      docs: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.docs }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            docs:
              - "docs/**"
              - "notebooks/**"
              - "proofs/papers/**"
              - "src/**"
              - "baml_src/**"
              - "README.md"
              - "zensical.toml"
              - "pyproject.toml"
              - "uv.lock"
              - "scripts/build_docs.py"
              - ".github/workflows/docs.yml"
              - ".github/actions/**"

  build:
    name: docs build
    needs: [changes]
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup # the notebook imports baml_sdk, so it must be generated
      - name: Cache the Titanic data
        # OpenML sometimes answers HTTP 503. The dataset never changes, so a fixed key is enough.
        # Bump the version in the key to force a new download.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scikit_learn_data
          key: openml-titanic-v1
      - name: Build the docs
        # scripts.build_docs exports the notebooks (it downloads the Titanic data from OpenML), runs
        # `zensical build --strict` and fails on a griffe warning, so a broken link or a docstring that does not
        # render fails the build. Zensical alone exits 0 on a griffe warning. The script also resolves the links of
        # the raw HTML (the notebook iframes, the paper link) under /EBaMl/, which strict mode does not read.
        # A local run uses the same command.
        env:
          # scikit-learn stores the OpenML download here, which is the cached folder.
          SCIKIT_LEARN_DATA: ${{ runner.temp }}/scikit_learn_data
        run: uv run --frozen --group docs python -m scripts.build_docs
      - name: Check the notebook and paper exports
        # Zensical ignores a `hooks` setting without a warning, and an iframe target is raw HTML that no link
        # check reads. A missing export would publish empty notebook pages.
        run: |
          for name in titanic local_explanations multiclass model_kinds; do
            test -s "site/notebooks/${name}.html" || { echo "::error::site/notebooks/${name}.html is missing or empty"; exit 1; }
          done
          test -s site/proofs/local-explanations.pdf || { echo "::error::site/proofs/local-explanations.pdf is missing or empty"; exit 1; }
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    name: deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
