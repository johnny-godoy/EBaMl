name: Changelog

# A pull request that changes what users get must add a changelog fragment (scripts/check_fragment.py). The label
# no-changelog marks a change that users do not see. This workflow is apart from CI because it must run again when a
# label changes, and the CI gates must not.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fragment:
    name: fragment
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Check for a changelog fragment
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: uv run --frozen --only-group release python -m scripts.check_fragment "$BASE"
