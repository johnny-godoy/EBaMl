site_name: EBaMl
site_description: BAML for Explainable Boosting Machines. Talk to your EBM.
site_url: https://johnny-godoy.github.io/EBaMl/
repo_url: https://github.com/johnny-godoy/EBaMl
repo_name: johnny-godoy/EBaMl
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Setup: setup.md
  - Usage: usage.md
  - Local explanations: local-explanations.md
  - LLM provider: providers.md
  - Notebooks:
      - Titanic: notebook.md
      - Local explanations: local-notebook.md
  - Benchmark: benchmark.md
  - API reference: api.md
  - Changelog: changelog.md

hooks:
  - scripts/docs_hooks.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: false
            members_order: source
            merge_init_into_class: true
            heading_level: 3

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true
