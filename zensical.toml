[project]
site_name = "EBaMl"
site_description = "Explain an Explainable Boosting Machine in plain words: descriptions, local explanations and edits."
site_url = "https://johnny-godoy.github.io/EBaMl/"
repo_url = "https://github.com/johnny-godoy/EBaMl"
repo_name = "johnny-godoy/EBaMl"
strict = true
# colors that pass the contrast checks of WCAG 2.2 AA in both color schemes, and focus that a reader can see (tests/site)
extra_css = ["stylesheets/extra.css"]
# a focus ring on an embedded notebook or paper (tests/site)
extra_javascript = ["javascripts/frame-focus.js"]
# The plans are handoff prompts for the agent that implements a milestone, with XML tags that are not HTML. ROADMAP.md
# links them on GitHub, so the site does not publish them.
exclude_docs = """
plans/
"""
nav = [
  { Home = "index.md" },
  { "What is an EBM?" = "what-is-an-ebm.md" },
  { "Why EBaMl?" = "why-ebaml.md" },
  { Setup = "setup.md" },
  { Usage = "usage.md" },
  { "Local explanations" = "local-explanations.md" },
  { "Editing a model" = "editing.md" },
  { "Choosing the model" = "providers.md" },
  { "Async API" = "async.md" },
  { "MCP server" = "mcp.md" },
  { Notebooks = [
    { "All notebooks" = "notebooks.md" },
    { "Global explanations" = "global-notebook.md" },
    { "Local explanations" = "local-notebook.md" },
    { Recourse = "recourse-notebook.md" },
    { "Custom audiences" = "audiences-notebook.md" },
    { Languages = "languages-notebook.md" },
    { "Model providers" = "providers-notebook.md" },
    { Multiclass = "multiclass-notebook.md" },
    { "Model kinds" = "model-kinds-notebook.md" },
    { "Vision models" = "vision-notebook.md" },
    { "Model editing" = "editing-notebook.md" },
    { "MCP server" = "mcp-notebook.md" },
    { "BAML agent" = "baml-agent-notebook.md" },
    { "Chat" = "chat-notebook.md" },
    { "Async API" = "async-notebook.md" },
  ] },
  { Proofs = [
    { "Local explanations" = "local-explanations-proof.md" },
    { "Multiclass scores" = "multiclass-scores-proof.md" },
    { "Recourse plans" = "recourse-proof.md" },
  ] },
  { Benchmark = "benchmark.md" },
  { Development = "development.md" },
  { Releasing = "releasing.md" },
  { "API reference" = "api.md" },
  { Changelog = "changelog.md" },
]

[project.theme]
# The system fonts: the site loads no stylesheet from Google Fonts, which can have no integrity hash and costs a
# request to a third party on each page.
font = false
features = [
  "content.code.copy",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
# attr_list and md_in_html give the grid of cards on the home page
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.superfences = {}
pymdownx.snippets.check_paths = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
show_root_heading = true
show_source = false
members_order = "source"
merge_init_into_class = true
heading_level = 3
