[project]
name = "ebaml"
version = "0.0.1"
description = "BAML for Explainable Boosting Machines: talk to your EBM."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["baml", "llm", "explainable-ai", "explainable-boosting-machine", "interpretml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
authors = [
    { name = "Johnny Godoy", email = "johnny.godoy@ing.uchile.cl" }
]
requires-python = ">=3.13"
dependencies = [
    "attrs>=26.1.0",
    "baml-bridge>=0.22.2",
    "beartype>=0.23.1",
    "interpret>=0.7.8",
    "orjson>=3.13.0",
    "structlog>=26.1.0",
]

[project.urls]
Documentation = "https://johnny-godoy.github.io/EBaMl/"
Source = "https://github.com/johnny-godoy/EBaMl"
Issues = "https://github.com/johnny-godoy/EBaMl/issues"
Changelog = "https://github.com/johnny-godoy/EBaMl/blob/main/CHANGELOG.md"

[tool.uv]
# A relative span keeps the cutoff 7 days behind today, so uv never picks a release that is less than 7 days old.
exclude-newer = "7 days"
# reason: security fixes must not wait for the 7-day cooldown. pillow 12.3.0 has 35 known CVEs fixed in 13.0.0, and
# certifi 2026.7.22 has 1 fixed in 2026.10.19, so Trivy fails on the older versions. Remove each entry once its fixed
# release is more than 7 days old. The check-exclusions hook fails when an entry is no longer needed.
exclude-newer-package = { pillow = false, certifi = false }

[tool.uv.build-backend]
# baml_sdk is generated by `baml generate` and gitignored: run it before `uv build`, or the wheel lacks it.
module-name = ["ebaml", "baml_sdk"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "demos",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "src/baml_sdk/*",
]
fix = true
preview = true
line-length = 120
src = ["src"]
target-version = "py313"
unsafe-fixes = true

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
preview = true

[tool.ruff.lint]
# reason: copyright notices are an unusual requirement that this project does not impose on its source files.
ignore = [
    "missing-copyright-notice",
]
preview = true
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# reason: recurring pattern in tests/: pytest tests use bare assert, literal expected values and private members by design,
# and are not public API, so docstrings are not required.
"tests/**/*.py" = ["undocumented-public-function", "magic-value-comparison", "assert", "private-member-access"]
# reason: every cell of a marimo notebook is a function that takes the names it uses as arguments, imports inside the
# first cell and shows its last expression, so these rules would fire in every cell of notebooks/.
"notebooks/**/*.py" = [
    "missing-type-function-argument",
    "missing-return-type-private-function",
    "import-outside-top-level",
    "invalid-argument-name",
    "useless-expression",
    "too-many-arguments",
    "too-many-positional-arguments",
]


[dependency-groups]
dev = [
    "cosmic-ray>=8.7.0",
    "marimo>=0.25.1",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "vulture>=2.16",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.7",
]

[tool.vulture]
# reason: fixtures are used through pytest's name-based injection, which vulture cannot see.
ignore_decorators = ["@pytest.fixture"]
# reason: pytest reads pytestmark by name, it is never referenced in code, so vulture reports it as unused.
ignore_names = ["pytestmark"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "--cov=ebaml --cov-report=term-missing"
# reason: beartype skips a function it cannot decorate and only warns, so the warning must fail the tests.
filterwarnings = ["error::beartype.roar.BeartypeClawDecorWarning"]

[tool.coverage.run]
branch = true
source = ["ebaml"]

[tool.coverage.report]
fail_under = 100
show_missing = true
